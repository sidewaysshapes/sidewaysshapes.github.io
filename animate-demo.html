<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animation Test</title>

<style>
.logo-images svg {
  position: absolute;
  top: 0px;
  left: 0px;
  animation: replace 3s linear;
  animation-fill-mode: forwards;
  opacity: 0;
}

@keyframes replace {
  0% {
    opacity:1;
  }
  99% {
    opacity:1;
  }
  100% {
    opacity:1;
  }
}

.logo-images #logo-svg {
  animation-delay: 0s;
}
.logo-images #lines-svg {
  animation-delay: 2.7s;
}

.logo-letter {
    transform-box: fill-box;
    transform-origin: center;
    animation: twist 3s linear;
    animation-fill-mode: forwards;
}

@keyframes twist {
    0% {
        transform: scaleX(1);
    }
    100% {
        transform: scaleX(0.015);
    }
}

.logo-images {
    transform-box: fill-box;
    transform-origin: center;
    animation: compressX 3.5s linear;
    animation-fill-mode: forwards;
}

@keyframes compressX {
    0% {
        transform: scaleX(1);
    }
    85% {
        transform: scaleX(1);
    }
    100% {
        transform: scaleX(0.4);
    }
}


</style>
